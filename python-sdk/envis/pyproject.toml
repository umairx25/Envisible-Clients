[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "envis"
version = "0.0.8"
description = 'Secure, simple, and powerful secret management.'
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
keywords = []
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "requests==2.32.5",
  "python-dotenv==1.0.1",
  "termcolor==3.3.0",
]
install_requires=[
    "requests==2.32.5",
    "python-dotenv==1.0.1",
    "termcolor==3.3.0",
]
[[project.authors]]
name = "Umair Arham"
email = "contact@uarham.me"

[project.urls]
Homepage = "https://envisible.dev"
Documentation = "https://github.com/umairx25/envis#readme"
Issues = "https://github.com/umairx25/envis/issues"
Source = "https://github.com/umairx25/envis"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/envis tests}"

[tool.coverage.run]
source_pkgs = ["envis", "tests"]
branch = true
parallel = true
omit = [
  "src/envis/__about__.py",
]

[tool.coverage.paths]
envis = ["src/envis", "*/envis/src/envis"]
tests = ["tests", "*/envis/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
